<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hisab book - kharcha add</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <div class="navbar">
        <h1> flat hisab</h1>
        <nav>
            <a href="index2.html">home </a>
            <a href="saman.html"> ghar ka saman </a>
            <a href="rental.html"> rental kharcha </a>
            <a href="wxpense.html" class="active"> kharcha add</a>
            <a href="history.html">history</a>
        </nav>
    </div>

    <div class="container">
        <div class="box">
            <h2>🧾 Naya Kharcha Add Karo</h2>
            <form id="expenseForm">
                <label>Kisne paisa diya</label>
                <select id="expPaidBy" required></select>

                <label>Kitne ka kharcha</label>
                <input type="number" id="expAmount" placeholder="Amount (₹)" required>

                <label>Category</label>
                <select id="expCategory" required>
                    <option value="Kirana">Kirana</option>
                    <option value="Bijli Bill">Bijli Bill</option>
                    <option value="Gas">Gas</option>
                    <option value="Internet">Internet</option>
                    <option value="Other">Other</option>
                </select>

                <label>Note (optional)</label>
                <input type="text" id="expNote" placeholder="jaise: August ka kirana saman">

                <label>Date</label>
                <input type="date" id="expDate" required>

                <label>Kis-kis me split hoga</label>
                <div id="expSplitBox" style="display:flex; flex-direction:column; gap:6px; margin-bottom:10px;"></div>

                <button type="submit">+ Kharcha Add Karo</button>
            </form>
        </div>

        <div class="box">
            <h2>📜 Kharcha History</h2>
            <ul class="item-list" id="expenseList">
                <li class="empty-msg">Abhi koi kharcha add nahi hua hai</li>
            </ul>
        </div>
    </div>

    <script src="sagar1203.js"></script>
    <script>
        // Dropdown aur checkboxes fill karo
        fillMemberSelect(document.getElementById('expPaidBy'));
        fillMemberCheckboxes(document.getElementById('expSplitBox'), 'expSplit');

        // Aaj ki date default
        document.getElementById('expDate').value = new Date().toISOString().split('T')[0];

        function renderExpenses() {
            // Rent wale expenses is page pe nahi dikhane (wo rental.html pe hain)
            const expenses = getExpenses().filter(e => e.category !== 'Rent');
            const list = document.getElementById('expenseList');
            list.innerHTML = '';

            if (expenses.length === 0) {
                list.innerHTML = '<li class="empty-msg">Abhi koi kharcha add nahi hua hai</li>';
                return;
            }

            expenses.slice().reverse().forEach((exp) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <div>
                        <strong>${formatRupee(exp.amount)}</strong>
                        <span class="tag">${exp.category}</span><br>
                        <small>${exp.paidBy} ne diya • ${exp.date}</small><br>
                        ${exp.note ? `<small>📝 ${exp.note}</small><br>` : ''}
                        <small>Split: ${exp.splitAmong.join(', ')}</small>
                    </div>
                `;
                const delBtn = document.createElement('button');
                delBtn.textContent = 'Hatao';
                delBtn.className = 'delete-btn';
                delBtn.onclick = () => {
                    const updated = getExpenses().filter(e => e.id !== exp.id);
                    saveExpenses(updated);
                    renderExpenses();
                };
                li.appendChild(delBtn);
                list.appendChild(li);
            });
        }

        document.getElementById('expenseForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const checkedBoxes = document.querySelectorAll('input[name="expSplit"]:checked');
            const splitAmong = Array.from(checkedBoxes).map(cb => cb.value);

            if (splitAmong.length === 0) {
                alert('Kam se kam ek member select karo split ke liye');
                return;
            }

            const expenses = getExpenses();
            expenses.push({
                id: generateId(),
                paidBy: document.getElementById('expPaidBy').value,
                amount: Number(document.getElementById('expAmount').value),
                category: document.getElementById('expCategory').value,
                note: document.getElementById('expNote').value,
                date: document.getElementById('expDate').value,
                splitAmong: splitAmong
            });
            saveExpenses(expenses);
            this.reset();
            document.getElementById('expDate').value = new Date().toISOString().split('T')[0];
            fillMemberCheckboxes(document.getElementById('expSplitBox'), 'expSplit');
            renderExpenses();
        });

        renderExpenses();
    </script>
</body>
</html>
